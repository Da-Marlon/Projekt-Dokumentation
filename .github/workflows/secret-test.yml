name: Secret Test

on:
  workflow_dispatch:   # Workflow per Button von Hand starten
  push:                # Workflow bei jedem Push starten

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Secret als Umgebungsvariable verwenden
        env:
          TEST: ${{ secrets.MEIN_SECRET }}
        run: |
          echo "Der Wert ist: $TEST"
